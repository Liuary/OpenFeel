# 下游契约（交付 stage-84/85；接口形态 = 函数签名级）
downstream_contracts:
  - name: "`src/core/req/aggregate.ts :: computeRequirementAggregate`（本阶段交付；首参形态定稿）"
    change: "`computeRequirementAggregate(data: FlowData, requirementId: string): RequirementAggregate`；`RequirementAggregate = { stageIds: string[]; stageCount: number; doneCount: number; aggregate: 'scheduled' | 'in_progress' | 'done' | null }`（**零关联阶段 → `aggregate = null`**——空集守卫，不作 done 判定）；done 判定**委托 `allLinkedStagesDone(data, requirementId)`**（`requirement-ops.ts:76-79` 单一原语——REV-83-002）；**首参形态定稿 = `data: FlowData` 直委托**（S-83-1；REV-83-011 落实：原契约 `(stages, requirementId)` 平移，值域补 `stageIds` 与 `null` 分支）；纯函数（无 IO）。"
  - name: "`src/core/req/aggregate.ts :: resolveRequirementStatusForStage`（本阶段交付）"
    change: "`resolveRequirementStatusForStage(data: FlowData, stageId: string): { requirementId: string; target: 'scheduled' | 'in_progress' | 'done' } | null`——单阶段 → 目标状态纯函数；阶段不存在 / 无关联（null/undefined/空串）→ `null`。"
  - name: "`src/core/req/aggregate.ts :: syncRequirementStatus`（本阶段交付——对称回写入口）"
    change: "`syncRequirementStatus(data: FlowData, stageId: string): string[]`——纯内存；返回受影响需求 ID 列表；规则 = 声明式单入口（聚合 done ∧ status ∈ `AUTO_DONE_PRECONDITION` → done；聚合 ≠ done ∧ status === done → `in_progress`），**不绑定事件**（S-83-3）；零关联 / 悬空 / 前置集外 / 状态无变化 → `[]` 且零审计零注入。触发点：`advanceStagePhase` 仅 done 分支 / `resetStagePhase` 写入后（dry-run 均不可达）。"
  - name: "`src/core/req/aggregate.ts :: AUTO_DONE_PRECONDITION`（本阶段交付）"
    change: "`readonly RequirementStatus[] = ['scheduled', 'in_progress']`——auto-done 前置集单点（REV-83-004）；回写守卫与 health 漂移判据**同口径**（S-83-4）。"
  - name: "`src/core/req/aggregate.ts :: requirementHealthItems`（本阶段交付）"
    change: "`requirementHealthItems(input: { data: FlowData; lang?: string }): HealthCheckItem[]`——只读纯函数；section 常量 `需求对账`（恒 1 条 pass/warn——悬空关联）/ `需求漂移`（条件 warn——前置集内 ∧ 聚合 done ∧ status ≠ done；`draft`/`blocked`/终态豁免）；**恒无 fail**（warn-only——不改退出码、不参与 `--fix`）。"
  - name: "审计动作名（本阶段交付）"
    change: "`requirement_auto_done`（detail `{ requirementId, from, to: 'done', triggerStage }`）/ `requirement_auto_reopen`（detail `{ requirementId, from: 'done', to: 'in_progress', triggerStage }`）；`agent: 'cli'`；仅在状态实际变化时写入（单点 `data.log`，与 `requirement_*` 家族同形）。"
  - name: "i18n 键前缀（本阶段交付）"
    change: "`flow.health.reqLinksPassTmpl` / `flow.health.reqDanglingTmpl` / `flow.health.reqDriftTmpl`（3 键双表成对）；新基线 **911**（908 + 3；`lint i18n` 实测为准）；键清单冻结于 op-003 步骤 3.3。"
  - name: "契约同步声明（对 v1.2.0/deps.yaml 已登记项）"
    change: "`v1.2.0/deps.yaml` 需求原语条「`computeRequirementAggregate(stages, requirementId)`／首参形态方案期定稿」由本文件前述条目**覆盖为定稿形态**（REV-83-011 落实；文件名与返回类型以本文件为准）。"

# 交付边界（本阶段不做，防越界）
out_of_scope:
  - "需求归档（`requirements` 随版本切分）——裁定 W：留后续版本"
  - "Agent 模板 / skill（openfeel-req / feel.md / openfeel-planner.md）——归 stage-84"
  - "README / docs / manual / CHANGELOG / 版本收口——归 stage-85"
  - "需求自动修复（health 只报告；不做 `--fix` 需求项 / 不做状态自动校正）——裁定 R 同范式"
  - "`done→scheduled` 细粒度回退 / 需求级细粒度进度百分比——不做（S-83-5）"
  - "`advanceStagePhase` 增加 `dryRun` 形参——不做（dry-run 由命令层截断；REV-83-007 已核验）"
  - "非 done 推进触发聚合回写（如 `scheduled → in_progress` 上推）——不做（REV-83-005：由 `req advance` 显式驱动）"
  - "真实 `.openfeel/requirements/` 与真实 flow.json `requirements` 键的创建——本阶段不在真实仓执行需求写入（测试全程 tmpDir）"
  - "npm publish / git push / CI / 第三方依赖 / build.js / package.json / pipeline.yaml / phase 枚举——零触碰"
