# 下游契约（契约先行：跨阶段复用的 API 形态 = 函数签名级）
downstream_contracts:
  - name: "src/core/flow-archive/ :: 归档原语（stage-78 交付，stage-79/80 消费）"
    change: "建议签名（方案期可微调，但语义先冻结）：`groupStagesByVersion(stages): Map<string, string[]>`（版本前缀分组，parseStageId 复用）；`splitForArchive(data, version): { archive: ArchiveFile; remainder: Partial<FlowData> }`（纯函数切分：stages/reviews/log + 保留集）；`writeArchiveFile(projectPath, archive): void`（fs 工具层 + 独立锁 `flow-archive` + 原子写）；`listArchiveVersions(projectPath): string[]`；`readArchiveFile(projectPath, version): ArchiveFile | null`；`addArchivedVersion(data, version): void`（幂等去重）。stage-79 命令层**零第二套解析/切分**。"
  - name: "src/core/flow-archive/ :: 命令面新增导出（stage-79 交付，stage-80 消费）"
    change: "① 版本校验/归一 helper（探针法复用 parseStageId；输入归一 =「去 v 后再加 v」，canonical 恒带 v；签名与命名方案期定稿，REV-79-004）；② 「版本作用域 blocking open REV」谓词 helper（谓词恒为 `r.blocking !== false && r.status === 'open'`，复用 versionOfReviewOp 同源解析；禁命令层第二套，REV-79-002）；③ `pipeline` 处置 helper（裁定 P；纯内存，命令层统一 save()；REV-79-005）。三者文件落点均在 src/core/flow-archive/ 内（禁 flow-manager.ts / 命令层内联）。"
  - name: "src/core/plan/path.ts :: 归档版本判定 helper（stage-80 交付；单一口径）"
    change: "`isArchivedVersionOf(stageId: string, archivedVersions: readonly string[] | undefined): boolean`——**全仓唯一实现**：显式版本前缀（全名格式 vX[.Y[.Z]]-stage-NN）∧ 版本 ∈ archived_versions；**短名恒 false**（短名经 parseStageId 归一为 v1.0.0-* 属默认版本语义，不得据以判「已归档」——REV-80-001）。落点理由：flow-manager 需复用（checkDanglingDeps）且**禁** flow-manager → flow-archive 运行时依赖（REV-80-005）；path.ts 为 parseStageId 唯一权威之家、四处调用方已 import、零新增模块边。消费方：commands/plan.ts、commands/flow.ts、commands/config.ts、core/flow-manager.ts、core/flow-archive/archive-health.ts。"
  - name: "src/core/flow-archive/archive-health.ts :: 归档一致性 health 检查（stage-80 交付）"
    change: "`archiveHealthItems(input: { projectPath: string; data: FlowData }): HealthCheckItem[]`（纯函数；warn 级；a. archived_versions ↔ listArchiveVersions 双向对账；b. data.stages 命中已归档版本前缀〔restore 带回〕）。消费方 = commands/flow.ts health action（合并 items；不改退出码；非 quick；不参与 --fix）。对 flow-manager 仅 `import type`（编译期擦除、零运行时依赖边）。"
  - name: "src/core/req/ :: 需求原语（stage-81 交付，stage-82/83 消费）"
    change: "建议签名：`addRequirement(data, { title, targetVersion?, priority? }): RequirementData`（ID = max+1，REQ-NNN；**新建即 `status:'draft'`**；**无 `source` 字段**〔REV-81-005：签名对齐 `RequirementData` 字段表〕；幂等/冲突语义于方案期冻结）；`getRequirements(data): RequirementData[]`（读侧宽容派生 `?? []`——不依赖 load 补齐，REV-81-003）；`getRequirement(data, id): RequirementData | null`；`listRequirements(data, filter?): RequirementData[]`（返回副本，核验 B8 范式）；`claimRequirement(data, id, owner): Result`（占用校验：已占用 → 错误码，**不写盘**）；`releaseRequirement(data, id): Result`；`updateRequirement(data, id, patch): Result`；`computeRequirementAggregate(stages, requirementId): { stageIds: string[]; stageCount; doneCount; aggregate }`（**纯投影**；**done 判定委托 `allLinkedStagesDone`（`requirement-ops.ts:76-79` 单一原语，含空集守卫）**——REV-83-002；**零关联阶段 → `aggregate = null`**（值域 = `scheduled` / `in_progress` / `done` / `null`；不作 done 判定）；**首参形态方案期定稿**（与委托原语 `allLinkedStagesDone(data: FlowData, requirementId)` 对齐，择一：① 首参改 `data: FlowData` 直接委托；② 抽 stages 级核心谓词〔`allLinkedStagesDone` 变薄壳、行为逐字不变〕、首参保持 `stages`；**禁第二份 done 表达式**——REV-83-011）；stage-83 交付但接口于 stage-81 登记）；`syncRequirementStatus(data, stageId): string[]`（done/reset 对称回写入口，纯内存，返回受影响需求列表；done 判定同源）。"
