mutual_exclusions:
  - group: [op-001, op-002, op-003, op-004, op-006, op-008]
    reason: "**热区源码互斥（主串行链）**：`src/core/flow-manager.ts`（op-001/002/004）、`src/commands/flow.ts`（op-001/002/004/008）、`src/core/plan/scheme.ts`（op-001/003/006）三者被多 op 共享 → 必须由**单执行流按序**触碰。"
  - group: [op-001, op-002, op-003, op-004, op-005, op-007, op-008]
    reason: "**`src/core/i18n-data/{zh-CN,en}.ts` 互斥写面**：七个 op 均新增/改写 i18n 键（键互不重叠，但**同文件写入必须串行**，否则互相覆盖）。→ 并行组（op-005/op-007）与主链的 **i18n 编辑窗口不得重叠**；建议实施顺序：先完成主链 op-001~004 的 i18n 编辑，再放行 op-005/op-007 集中补键，最后 op-006→op-008。"
  - group: [op-001, op-002, op-003, op-004, op-005, op-006, op-007, op-008, op-009]
    reason: "**构建/测试互斥**：九个 op 的验收均含 `npm run build` 或 `npm test`（同一工作区）→ 任一时刻仅一个 op 处于 build/test 窗口；并发会竞态写 `dist/**`、`src/core/template-loader.ts` 生成段与 `.opencode/**` 自举副本。"
  - group: [op-005, op-007]
    reason: "**弱约束**：二者与主链文件面无交叠（可并行），但均修改 `i18n-data/*`（见上组）→ 建议将二者的 **i18n 编辑**串行化；且 op-007 的 `npm run build` 会重建 `dist/**`，与 op-005 的测试窗口重叠时测试可能读到半新 dist → **建议错开**。"
  - group: [op-001, op-003, op-006]
    reason: "**`core/plan/scheme.ts` 三方共享**：op-001（removeScheme 同文件）、op-003（ensureStageSkeleton 调用）、op-006（命名/extractTitle）→ 主串行链内已按 op-001→003→006 排序，禁止并行。"

