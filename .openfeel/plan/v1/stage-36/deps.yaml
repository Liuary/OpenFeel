      - "opencode.jsonc"
    description: "14 skill 加 openfeel- 前缀：① templates-data/opencode/skills/ 14 目录 git mv + SKILL.md frontmatter name: 同步；② update.ts NEW_SKILL_NAMES（L1209-1218）8 项加前缀（不扩列表）、buildUpdatedJsonc L1380 路径随名自动变化、getIncomingContent L1802 正则无需改（.+ 天然匹配）、L60/L1377 注释 /opfx:* → openfeel-*；③ feel.md（zh-CN+en）「/opfx: 技能」表按 D36-1 映射改为按类型分类引用（CLI 命令/agent/skill/文字），废除 /opfx: 前缀，code/test 改文字，补 status→openfeel flow overview（REV-305），/opfx:utility→openfeel-utility、/opfx:flow→openfeel flow；④ 源码 /opfx: 注释清理（flow.ts L14/158/161、i18n zh-CN L446 / en L424 的 /opfx:status→openfeel flow overview、update.ts L60）；⑤ 全库 skill 名引用同步（区分 CLI 子命令同名词 health/recover/roadmap/wizard/model-check/model-config）；⑥ 根版 opencode.jsonc skills 块手动更新为 14 条 openfeel- 前缀路径（REV-401 修订：手写块非 SKILLS_PLACEHOLDER，原 9 条补齐 health/recover/roadmap/search-kb/wizard 至 14 条对齐模板）。hard 依赖 op-002（feel.md/update.ts 冲突域重叠，串行）。"

  op-004:
    file: "ops/op-004.md"
