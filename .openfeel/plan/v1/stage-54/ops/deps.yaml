# 收尾阶段（发布前清账）：E1~E12 逐条实测 → **需修 3 条（E1/E2/E3）**，其余为「已解决（仅登记）」「登记不修」「门禁类」。
# **范围**：含空模板检测收紧、en 泄漏收敛、help 文案补键、工作区数据一致性、E6 分层清单；
# **不含** `npm publish`；**不改 `flow.json`**（E11/A6）；**不含 bug/REV 状态变更**（属 openfeel-feel-tester）。

ops:
  op-001:
    file: op-001.md
    title: "E1 空模板检测整行锚定收紧（含 E1-补 已知边界登记）"
    produces:
      - src/core/flow-manager.ts
      - src/core/plan/scheme.ts
      - src/commands/flow.ts
      - test/core/flow-manager.test.ts
      - test/commands/plan.test.ts
      - test/commands/flow.test.ts
    deps: []
    notes: "**E1（`cli/BUG-005`，medium）**：`isTemplateEmpty` 由**纯子串** `content.includes('- [ ] 待补充')` → **整行锚定** `/(?:^|\\n)[ \\t]*-\\s*\\[\\s*\\]\\s*待补充[ \\t]*(?=\\r?\\n|$)/`（缩进/CRLF/尾空白容错）；`detectFillState` 的 `empty` 自动复用、`partial` 口径统一（**返回域不变**）；`scheme.ts:455` 改调 `isTemplateEmpty`（消除第二处子串判断，**`EMPTY_TEMPLATE_MARKER` import 保留**）；注释补「整行锚定 + 围栏内独占行 = 已知边界」。**预验证（实测）**：`stage-52/ops/op-005.md` 旧子串 `true`（误报）→ 新整行 `false`；模板独占行 LF/CRLF/缩进 → `true`；行内引用 → `false`。**E1-补（REV-54-002 / A9）**：`ops list` 的 `null → filled` **登记为已知边界**（`flow.ts:935-937` 注释 + manual 要点 + 断言④锁定**短 opId HIT / 全名 null**），**不改 `detectFillState` 契约与 `--json` 契约**。**断言 ①~④（4 条）**；**强制翻转 0 项**（既有 fixture 均为独占行）。验收含 **`flow health` 空模板告警归零** + 修复前后对照。"

  op-002:
    file: op-002.md
    title: "E2 en 泄漏收敛与 E3 help 文案补键（E12 门禁 726）"
    produces:
      - src/commands/flow.ts
      - src/core/i18n-data/zh-CN.ts
      - src/core/i18n-data/en.ts
      - test/core/i18n.test.ts
      - test/commands/flow.test.ts
    deps:
      - op: op-001
        type: hard
    notes: "**E2（`cli/BUG-006`，low）**：`flow.ts:742-743` 硬编码中文 → `t('flow.advance.blockingRevRefused' / 'flow.advance.blockingRevHint')`（A3 命名，与既有 `flow.advance.forceRevRefused` 同族；`:740` 已 i18n）；zh 文案**逐字不变**，en 对称；**A4**：`project.ts:101`/`init.ts:48·110`/`update.ts:93` 的 `console.log` 中文**登记不改**。**E3（`cli/BUG-003`，low，复发）**：`help.flow.phases.json`（`zh-CN.ts:595`/`en.ts:565`）**文案补 `transitionsDiff`**（**A2：JSON 契约不动**——实际仍 5 键）；`test/core/i18n.test.ts:111-119` **追加** zh/en 两条断言（既有 `advanceAccepted` 断言保留）。**E12**：`lint i18n` **724 → 726**。断言 ⑤/⑤b/⑥/⑥b；**强制翻转 0 项**。"

  op-003:
    file: op-003.md
    title: "E4-E11 登记收口与工作区数据一致性（全量门禁）"
    produces:
      - .openfeel/users/Liuary/bugs/index.md
    deps:
      - op: op-002
        type: hard
    notes: "**E4/E5/E7/E9/E10 登记**（已解决 → 仅登记，附可复跑证据）；**E5 连带**：修正 `bugs/index.md` 统计（现状 `open 4 / closed 12 / low 3` → 实测 **`open 3 / closed 13`** + 优先级按实测；**最小 diff**，仅统计表数字）；**E6 分层清单**（**实时重跑**可复现脚本，兼容混合编号 `REV-U2/U3/U4/U8` 与 `（注记）`；口径：清账层 / 历史层 / **无法判定单列**）→ 覆盖 v1.1.2 清账层**全量**，附证据与建议状态，**状态由 tester 收口**；**E8** 8 条**不修**项出处 `rg` 复核；**E11** 仅登记 + **A6 裁定 = 不改 `flow.json`**；**全量门禁**（build 幂等 / ≥59 文件 ≥979 用例 / **lint i18n 726 退出码 0** / lint kb 0 过期 265 引用 / **flow health 空模板归零** / tsc 0）+ 零污染双快照。**不含 bug/REV 状态变更**（tester 职责）。**收口报告**写入 `.openfeel/users/Liuary/log/{日期}-{NNN}.md`（**执行时取下一个可用编号**；不入 `produces` 的 glob 校验）"

# 【互斥（禁止并行）】
mutual_exclusions:
  - group: [op-001, op-002]
    reason: "**同文件热区**：二者均改 `src/commands/flow.ts`（op-001 改 `:935-937` 注释 / op-002 改 `:742-743` 文案）→ 必须**顺序**（op-001 → op-002）。"
  - group: [op-001, op-002, op-003]
    reason: "**构建/测试互斥**：三者验收均含 `npm run build` 或 `npm test`（同一工作区）→ 任一时刻仅一个 op 处于 build/test 窗口。"
  - group: [op-003, op-001, op-002]
    reason: "**收口顺序**：op-003 的门禁（`lint i18n` **726**、`flow health` 空模板归零）依赖 op-001/op-002 的代码改动 → **必须最后执行**。"

