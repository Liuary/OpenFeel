parallel_groups:
  - group: [op-005]
    desc: "REV-011 测试隔离修复（仅 test/commands/init.test.ts）——与源码热区无交集，**可立即并行**于任一 op（建议最先执行，先解除 blocking）"
  - group: [op-003]
    desc: "状态正确性点状修复（建议先行，快速收口；改动面最小）"
  - group: [op-004]
    desc: "审计日志 + scheme.ts 兜底冲突检测（独立点状修复）"
  - group: [op-001]
    desc: "级联底座（改权威源 + build 重生成）"
  - group: [op-002]
    desc: "config effective（硬依赖 op-001）"

# 注：op-001~op-004 共享 flow-manager.ts，四者无真正可并行；op-005 仅改测试文件，可并行穿插。
