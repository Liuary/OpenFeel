# 由 Schemer 自动生成，Feel 调度前 glob 校验存在性
# 参见 kb/patterns.md #op 文件命名规范（仅编号）+ #deps.yaml 声明实际文件名

version: "1.1"
stage: v1.1.2-stage-52
series: v1

# 【跨阶段约束】
cross_stage_constraints:
  - after_stage: v1.1.2-stage-51
    type: hard
    status: satisfied
    reason: "stage-51（反馈二 N1~N11，已 done/归档）为本阶段热区基线：`flow-manager.ts` / `commands/flow.ts` / `commands/plan.ts` / `core/plan/scheme.ts` 均为其改动区，必须串行其后；且 B3/B4 建立在 stage-51 N8（op 命名 `op-NNN.md`）与 N1（op↔opsDir 对账 `findOrphanOps`）之上。"
  - after_stage: v1.1.2-stage-50
    type: soft
    status: satisfied
    reason: "stage-50 的 `lint` 退出码（R1）已落地 → 本阶段 `lint i18n`/`lint kb` 失败**非 0 退出**，各 op 门禁须按「problems = 0 且退出码 0」执行。"

# 【沿用的跨阶段契约（禁自建/禁破坏）】
carried_contracts:
  - name: syncCurrentOp
    provider_stage: v1.1.2-stage-50
    provider_op: op-001
    consumer_stage: v1.1.2-stage-51
    consumer_op: op-004
    constraint: "`pipeline.current.op` 生命周期**唯一 owner**（`FlowManager.syncCurrentOp`）。本阶段**不得**另写指针维护逻辑；op-004 不触碰该 owner（只验证 `rg` 计数 ≥3）。"
  - name: findSimilarEntries
    provider_stage: v1.1.2-stage-50
    provider_op: op-001
    consumer_stage: v1.1.2-stage-51
    consumer_op: op-007
    constraint: "`findSimilarEntries(target, category, basePath?)`：`basePath` = `.openfeel/kb` 绝对路径、调用时解析；命令层**只允许传参**。本阶段 op-008 **只修内部解析（CRLF 归一化）**，**不改签名/不改路径语义**。"
  - name: addReviewEntry
    provider_stage: v1.1.2-stage-50
    provider_op: op-003
    consumer_stage: v1.1.2-stage-51
    consumer_op: op-002
    constraint: "`addReviewEntry` 为审查条目**单点实现**（被 `flow review add` 独占使用）。op-009 移除 `view add` 时**必须保留**该单点（`rg` 验收：定义 1 + 使用 1）。"

