# OpenFeel × DSH bundle patch
#
# This is the DSH adaptation layer of OpenFeel: one loader row that mounts the
# Feel-mode adapter. The adapter projects OpenFeel's CLI and `.openfeel/`
# workspace into DeepSeek Harness — it owns no domain state of its own, so all
# pipeline, requirement, and archive authority stays with the OpenFeel CLI.
#
# A profile mounts this bundle by listing `openfeel-dsh` in
# `dsh.profile.bundles`; the row below is then inserted over the profile root.
# Later layers (and the user's own cordis.patch.yml) address it by `id`.

- insert:
    - id: openfeel-feel
      name: 'openfeel-dsh'
      config:
        # CLI 可执行文件：默认走 PATH / npm 全局 bin / node 同目录探测。
        command: openfeel
        # 单次调用超时（毫秒）。大项目 flow.json 可达数百 KB，放宽到 120s。
        timeoutMs: 120000
        # 是否写 OpenFeel CLI 运行日志（~/.openfeel/cli/logs/）。
        # 默认关闭：只读沙箱下写全局目录会失败，且该日志对 agent 无价值。
        log: false
        # 是否注入 Feel 纪律系统提示段。启用 Feel 模式时通常应为 true。
        autoPrompt: true
        # 系统提示段语言：zh-CN | en
        language: zh-CN
        # 未初始化工作区的提示策略：
        #   auto   = 已初始化→完整 Feel 纪律；未初始化→短 bootstrap（默认）
        #   always = 所有工作区都注入完整 Feel 纪律
        #   off    = 不注入任何提示
        activation: auto
        # 写入门禁（ctx.tools.guard）——三层：文件工具 / shell / 受保护路径。
        #   always  = 所有工作区都拦截（默认；无 .openfeel 时也会拒绝写文件）
        #   project = 仅当会话工作区本身是 OpenFeel 项目时拦截
        #   off     = 完全不注册 guard（含 flow.json/status.md 也不拦）
        enforce: always
        # general 需求在 in_progress 且无阶段时，允许源码写入（需求级例外）。
        allowGeneral: true
        # 会话工作区（可选，cwd 解析链第 3 环）。
        # 完整链（取第一个可用值）：
        #   ① OPENFEEL_GUARD_CWD（env，最高优先级逃生阀，非空即生效）
        #   ② agent.session.header.cwd（正常链路）
        #   ③ config.cwd（本项）
        #   ④ 会话登记表 [sessionId]
        #   ⑤ process.cwd()（仅当该目录本身含 .openfeel/）
        #   ⑥ 全部失败 → fail-closed 拒绝（绝不静默放行）
        # 缺省不配即可；宿主升级拿不到会话 cwd 时，先设 OPENFEEL_GUARD_CWD 救急（无需改 profile），
        # 再把项目绝对路径配在这里。非 ② 来源都会在 stderr 告警并在 feel_status.guard 里标 degraded。
        # cwd: 'C:\path\to\OpenFeel'
        # 默认受守卫的工具：edit / write / apply_patch / str_replace_editor / bash / pwsh
        # （shell/execute_command/exec 本宿主不存在，仅作跨宿主防御）。
        # shell（bash/pwsh）默认受守：可判定即拒（第 1 类受保护 / openfeel 写子命令、
        # 第 2 类可解析的源码/文档写），**无法判定是否写（第 4 类）默认告警放行**
        # —— op-005 起未识别命令不再静默当作「没有写」，审计 kind=undecidable 可查。
        # shellGate 三档（缺省 = 上面这个默认组合；只影响 shell 分支，文件工具不受影响）：
        #   strict = 第 4 类也拒；warn = 第 1/2/4 类全部告警放行；off = shell 完全不守。
        # 环境变量 OPENFEEL_SHELL_GATE 优先级高于此处（排障逃生阀，取值同为 strict|warn|off）。
        # **注意：本文件的 enforce / shellGate 是门禁自身的开关，已纳入受保护名单
        # （PROTECTED_WORKSPACE_PATHS）；agent 改不了，只能由人类在这里调整后重启宿主。**
        # shellGate: strict
