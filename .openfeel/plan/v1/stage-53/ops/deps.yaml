      landed: "op-002 新增 **§三.5 命名映射** + 索引/主题骨架 + D4-3/D4-6 + §六 + 验收 15/16；op-004 produces/映射表/交接文档（`pending.md`）/验收 15/16；op-005 D8-1（`dev_last/decisions.md`）"
