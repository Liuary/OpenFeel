ops:
  op-001:
    file: "ops/op-001.md"
    title: "双层模板源收敛为单源（templates-data/opencode/）"
    depends_on: []
    stage: "v1.1.0-stage-36"
    type: hard
    produces:
      - "src/core/templates-data/opencode/agents/zh-CN/feel.md"
      - "src/core/templates-data/opencode/agents/en/feel.md"
      - "build.js"
      - ".gitattributes"
    description: "三对双层源（agent/instruction/skill）逐文件取较新合并到唯一权威树 templates-data/opencode/：feel.md 并入 agents/ 版的「冲突检测」节、instruction 取 opencode/instructions/ 版（含 Vision）；删除 templates-data/agents/（18）与 core-instructions/（2）；build.js 源路径改指权威树（SKILLS_DIR 重指、generateAgentDefinitions/generateTemplateFromCoreMd/validate* 改读 TEMPLATE_OPENCODE_*）、清理死常量（CORE_MD_PATH/AGENTS_DIR/TEMPLATE_CORE_MD_PATH/TEMPLATE_AGENTS_MD_PATH）；skill/agent/agents-md 注入前 CRLF→LF 归一 + 新增 .gitattributes；新增 validateSingleSourceConsistency 断言三对对象键集与内容一致；D36-5 reviewer 模型只读核对（保持 glm-5.2）。D36-4 定夺：不合并两套定义，保留 SKILL_DEFINITIONS/OPENCODE_SKILL_DEFINITIONS + AGENT_TEMPLATES/OPENCODE_AGENT_TEMPLATES 双对象 + 单源 + 一致性断言（N2）。先导 op，无依赖。"

