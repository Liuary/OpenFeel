        type: hard
    notes: "**F1（本流水线唯一操作本机真实全局目录的 op）**：① `npm run build`（dist 与模板一致）；② **人工整目录备份** `Copy-Item -Recurse ~/.config/opencode → $env:TEMP\\opencode\\stage55-global-backup`（+ 可选 SHA256 清单；如需省时可排除 `node_modules`，**须记录**）；③ 执行 **`node bin/openfeel.js setup`**（`src/core/setup.ts:29-110` 纯全局/幂等/`deployGlobalAsset` 写前备份）——**不用 `update`**（`update.ts:1572+` 会触碰项目侧 legacy 检测，与即将删除的资产交叠）。**门 B（B1~B6）**：全局 skills **17**（含 `openfeel-cli-usage`；现状 16）/ 全局 `AGENTS.md` 含**模块手册**节 + **权限模型**节（现状 443 行且缺该节）/ agents **9** / 全局 `opencode.jsonc` 保留 `default_agent`+`$schema`（用户字段不丢）/ 备份快照存在。**失败拦截**：备份未成或任一判据未过 → **回滚后停止，不得进入 op-003**。**回滚**：整目录恢复为**首选**（`Remove-Item` + `Copy-Item` 自备份）、`~/.openfeel/backup/{ts}/` 逐文件为次选。**仓库零改动**（验收含 `git status` 无变化）。"

