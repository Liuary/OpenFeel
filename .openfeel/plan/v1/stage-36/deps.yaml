      - "src/core/update.ts"
      - "build.js"
      - ".opencode/ADAPTER.md"
      - ".opencode/agents/openfeel-planner.md"
      - ".opencode/skills/openfeel-check-kb/SKILL.md"
      - "test/core/update.test.ts"
      - "test/core/flow-manager.test.ts"
      - "test/core/plan/roadmap.test.ts"
      - "test/core/template-loader.test.ts"
      - "test/core/metrics.test.ts"
      - "test/core/view/entry.test.ts"
      - "test/core/archive/merge.test.ts"
      - "test/core/artifact-graph/instruction-loader.test.ts"
      - "test/core/flow-concurrent.test.ts"
      - "test/core/init.test.ts"
      - "test/commands/flow-migrate.test.ts"
    description: "① npm run build 重生成 template-loader.ts（AGENT_TEMPLATES/OPENCODE_AGENT_TEMPLATES/OPENCODE_SKILL_DEFINITIONS/OPENCODE_CONFIG_TEMPLATES/CORE_INSTRUCTIONS_TEMPLATES）与 update.ts（SKILL_DEFINITIONS）生成段，键带新名；② build.js 新增步骤 8（置于 tsc 之后，await import dist 的 atomicWriteFileSync；REV-402 修订：先 rmSync 清空 .opencode/agents 旧名 .md 与 .opencode/skills 旧目录、skills 写入前 mkdirSync，再全量重写，避免新旧并存）从权威源重生成 .opencode/{agents,skills,instructions,ADAPTER.md} 25 文件并插入 N3 生成物标记 openfeel:generated（frontmatter 闭合 --- 之后 / 无 frontmatter 首行），与 stage-38 begin/end 控制区标记契约兼容（generated 单行文件级信号）；③ 11 个测试文件断言同步，REV-306 二分：构造写入用新名 vs 读取兼容保留旧名+断言展示新名，伪阳性清单（<utility> XML / CLI 子命令 / type:utility / agent:'flow-manager' / openfeel 项目名）勿改；④ 收尾重启 opencode 提醒；⑤ npm run build && npm test + lint i18n/kb 全量回归。hard 依赖 op-001/002/003。"

# 依赖关系说明：
# - op-001 无依赖（先导，产出单一权威源 + 收敛后的 build.js）。
# - op-002 hard 依赖 op-001（须在收敛后的单树上重命名）。
# - op-003 hard 依赖 op-002（两者均编辑 feel.md 与 update.ts，文件冲突域重叠，须串行）。
# - op-004 hard 依赖 op-001/op-002/op-003（重生成 + 测试依赖前三者全部落定）。

# 建议执行顺序（严格串行）：
#   op-001 → op-002 → op-003 → op-004
#   （四者冲突域高度重叠：op-001 改 build.js/模板树，op-002 改 flow-manager/agents/AGENTS.md，
#     op-003 改 update.ts/feel.md，op-004 重生成全部产物 + 测试；依赖图已标 hard，批次调度 = 单一串行批次）

# 文件冲突域分析：
# - op-001：templates-data/opencode/agents（feel.md 合并）、删除 agents/ 与 core-instructions/、build.js、.gitattributes
# - op-002：templates-data/opencode/agents（重命名 + 正文）、flow-manager.ts、merge.ts、entry.ts、scheme.ts、init.ts、
#   agents-md、instructions、AGENTS.md、opencode.jsonc ×2、flow.ts/metrics.ts/view.ts（读取归一）
# - op-003：templates-data/opencode/skills（重命名）、update.ts、feel.md、agents-md/instructions/AGENTS.md（skill 引用）、
#   flow.ts/i18n-data（/opfx: 清理）
# - op-004：template-loader.ts/update.ts 生成段、build.js 步骤 8、.opencode/**、11 个测试文件
#   重叠点：op-002 与 op-003 均触 feel.md（agent 名 vs skill 表）与 update.ts（executor 写入 vs NEW_SKILL_NAMES），
#   故 op-003 hard 依赖 op-002；op-004 触碰前三者全部产物，故排最后。

