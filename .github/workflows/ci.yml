name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Env snapshot (before test)
        run: |
          # 守卫窗口起点：build 之后（build 之前无环境写入步骤）
          snapshot() {
            for d in "$HOME/.openfeel" "$HOME/.config/opencode" "$HOME/.config/openfeel" "./.openfeel/config.yaml"; do
              key=$(echo "$d" | tr '/.' '__')
              if [ -e "$d" ]; then
                find "$d" -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sort > "$RUNNER_TEMP/snap_before_$key"
              else
                echo "ABSENT" > "$RUNNER_TEMP/snap_before_$key"
              fi
            done
          }
          snapshot
      - name: Version consistency guard
        run: |
          # 版本门禁（stage-48 op-003 / 遗留 #10）：CLI --version 必须与 package.json.version 一致
          CLI_VERSION=$(node bin/openfeel.js --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "CLI=$CLI_VERSION package.json=$PKG_VERSION"
          if [ "$CLI_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::版本不一致：CLI=$CLI_VERSION package.json=$PKG_VERSION"; exit 1
          fi
      - run: node bin/openfeel.js lint i18n
      - run: npm test -- --reporter=verbose
      - name: Coverage report (baseline observation; non-blocking)
        run: npm run test:coverage
      - name: Env guard (after test — must be unchanged)
        run: |
          # 环境守卫（stage-48 op-002 / 遗留 #12）：测试前后比对全局目录 + 仓库项目配置，防止静默覆写真实环境
          fail=0
          for d in "$HOME/.openfeel" "$HOME/.config/opencode" "$HOME/.config/openfeel" "./.openfeel/config.yaml"; do
            key=$(echo "$d" | tr '/.' '__') ; f="$RUNNER_TEMP/snap_after_$key"
            # 存在性分支：目录不存在时记 ABSENT（ABSENT→ABSENT 视为通过，避免 ubuntu runner 误报）
            if [ -e "$d" ]; then
              find "$d" -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sort > "$f"
            else
              echo "ABSENT" > "$f"
            fi
            if ! diff -u "$RUNNER_TEMP/snap_before_$key" "$f" >/dev/null; then
              echo "::error::环境被测试改动：$d"; diff -u "$RUNNER_TEMP/snap_before_$key" "$f" || true; fail=1
            fi
          done
          exit $fail

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    env:
      NODE_AUTH_TOKEN: ${{ secrets.OPENFEEL_AUTO_NPM }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if version changed
        id: version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view openfeel version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$REMOTE_VERSION" ]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
        if: steps.version.outputs.changed == 'true'
      - run: npm run build
        if: steps.version.outputs.changed == 'true'
      - name: Version consistency guard
        if: steps.version.outputs.changed == 'true'
        run: |
          # 版本门禁（stage-48 op-003）：发布前再校验 CLI 与 package.json 版本一致
          CLI_VERSION=$(node bin/openfeel.js --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$CLI_VERSION" != "$PKG_VERSION" ]; then echo "::error::版本不一致 CLI=$CLI_VERSION pkg=$PKG_VERSION"; exit 1; fi
      - run: npm publish --access public --registry https://registry.npmjs.org
        if: steps.version.outputs.changed == 'true'
