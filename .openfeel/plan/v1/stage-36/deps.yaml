    title: "agent 重命名（8 个加 openfeel- 前缀 + P5 读取兼容 + normalizeAgentName）"
    depends_on: ["op-001"]
    stage: "v1.1.0-stage-36"
    type: hard
    produces:
      - "src/core/flow-manager.ts"
      - "src/core/archive/merge.ts"
      - "src/core/view/entry.ts"
      - "src/core/plan/scheme.ts"
      - "src/core/init.ts"
      - "src/core/templates-data/opencode/agents/zh-CN/openfeel-planner.md"
      - "src/core/templates-data/opencode/agents/en/openfeel-planner.md"
      - "src/core/templates-data/agents-md/zh-CN.md"
      - "src/core/templates-data/agents-md/en.md"
      - "src/core/templates-data/opencode/instructions/zh-CN.md"
      - "src/core/templates-data/opencode/instructions/en.md"
      - "AGENTS.md"
      - "opencode.jsonc"
      - "src/core/templates-data/opencode/opencode.jsonc"
      - "src/commands/flow.ts"
      - "src/core/metrics.ts"
      - "src/commands/view.ts"
    description: "8 agent 加 openfeel- 前缀（feel 保留）：① 权威源 templates-data/opencode/agents/{zh-CN,en}/ 16 文件 git mv 重命名；② flow-manager.mapPhaseToAgent 返回新名 + 新增导出 normalizeAgentName（内部 toLowerCase 归一大小写 REV-304、幂等、feel/none/unknown/非 agent 值原样保留）；③ 写入点改新名（flow-manager L1556/1575/1593 executor、merge L118 archiver、entry L52/62/129 reviewer、scheme L37/L122 Executor、init L462/463 executor）；④ 全库 markdown 引用同步（最长优先 + (?<!openfeel-) 负向断言，feel 不替换，区分 type:utility 任务标签 vs subagent_type:utility agent 名）；⑤ opencode.jsonc ×2：default_agent 保持 feel、agent.* 键带前缀；⑥ P5 读取兼容接入 normalizeAgentName 于 flow status --verbose（responsibleAgent L133 / change.agent L119）、flow overview（entry.agent L271）、flow log、flow metrics、view list（filed_by L31）所有读取展示点，不迁移 flow.json 历史。hard 依赖 op-001（收敛后单树重命名）。"

  op-003:
    file: "ops/op-003.md"
    title: "skill 重命名（14 个加前缀）+ /opfx: 类型化统一"
    depends_on: ["op-002"]
    stage: "v1.1.0-stage-36"
    type: hard
    produces:
