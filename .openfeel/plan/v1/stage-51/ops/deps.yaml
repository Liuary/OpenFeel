    notes: "N1 三子项：`plan scheme remove <stage> <opId>`（保护：done/checkpoint 默认拒绝 + `--force`；孤儿直删；**不删模板文件**）+ `flow repair` op↔opsDir 对账（**A2：默认只报告**、`--prune-orphans` 仅清键孤儿、fileOrphans 永不自动删）+ `flow health` 孤儿 warn（不改变退出码）。**共用 `findOrphanOps` 单一判定**。**主串行链首环**。"

