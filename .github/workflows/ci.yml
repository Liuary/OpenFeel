name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Version consistency guard
        env:
          OPENFEEL_LOG: '0'
        run: |
          # 版本门禁（stage-48 op-003 / 遗留 #10）：CLI --version 必须与 package.json.version 一致
          # stage-59 M1：注入 OPENFEEL_LOG=0，使 --version 不写 ~/.openfeel（守卫窗口内零副作用）
          CLI_VERSION=$(node bin/openfeel.js --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "CLI=$CLI_VERSION package.json=$PKG_VERSION"
          if [ "$CLI_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::版本不一致：CLI=$CLI_VERSION package.json=$PKG_VERSION"; exit 1
          fi
      - env:
          OPENFEEL_LOG: '0'
        run: node bin/openfeel.js lint i18n
      - name: Env snapshot (before test)
        run: |
          # 守卫窗口起点：紧贴 Test 之前（stage-59 M4 下移）；此前 Version consistency guard / lint i18n 均已注入 OPENFEEL_LOG=0
          # 快照三态（stage-59 M5）：ABSENT（不存在）/ EXISTS-EMPTY（存在但无文件）/ 逐文件 sha256 清单
          snapshot() {
            for d in "$HOME/.openfeel" "$HOME/.config/opencode" "$HOME/.config/openfeel" "./.openfeel/config.yaml"; do
              key=$(echo "$d" | tr '/.' '__')
              if [ -e "$d" ]; then
                manifest=$(find "$d" -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sort)
                if [ -n "$manifest" ]; then printf '%s\n' "$manifest" > "$RUNNER_TEMP/snap_before_$key"; else echo "EXISTS-EMPTY" > "$RUNNER_TEMP/snap_before_$key"; fi
              else
                echo "ABSENT" > "$RUNNER_TEMP/snap_before_$key"
              fi
            done
          }
          snapshot
      - name: Test
        run: |
          # 保退出码（pipefail）：tee 不得吞掉 npm test 失败码；日志落 $RUNNER_TEMP（不污染 Env guard 四路径）
          # REV-004：--no-color 关闭 vitest 3.x 在非 TTY 重定向下仍输出的 ANSI 色码（FORCE_COLOR=0 对该 reporter 无效）
          set -o pipefail
          npm test -- --reporter=verbose --no-color 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Test failure annotations
        if: failure()
        run: |
          # 失败时把失败用例名转成可经 GitHub API 读取的注解（只读诊断；不改判定语义）
          LOG="$RUNNER_TEMP/test.log"
          if [ ! -f "$LOG" ]; then
            echo "::warning::未找到测试日志 $LOG，无法生成失败注解"
            exit 0
          fi
          # REV-004：首选 --no-color；此处再以 sed 剥 ANSI 色码兜底，防 vitest 未来版本行为漂移。
          # GNU sed 的 ESC 转义 \x1b 在 ubuntu-latest（GNU sed）可用；windows runner 不涉及（本 workflow 仅 ubuntu）。
          # 剥色后失败用例行形如 "× test/... > 用例名 Nms"，原 grep 模式命中。
          sed 's/\x1b\[[0-9;]*m//g' "$LOG" \
            | grep -E '^\s*(×|FAIL)|Failed Tests' \
            | head -n 20 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done
          exit 0
      - name: Coverage report (baseline observation; non-blocking)
        run: npm run test:coverage
      - name: Env guard (after test — must be unchanged)
        run: |
          # 环境守卫（stage-48 op-002 / 遗留 #12）：测试前后比对全局目录 + 仓库项目配置，防止静默覆写真实环境
          fail=0
          for d in "$HOME/.openfeel" "$HOME/.config/opencode" "$HOME/.config/openfeel" "./.openfeel/config.yaml"; do
            key=$(echo "$d" | tr '/.' '__') ; f="$RUNNER_TEMP/snap_after_$key"
            # 三态表示与 before 快照一致（stage-59 M6）：ABSENT / EXISTS-EMPTY / 逐文件 sha256 清单
            if [ -e "$d" ]; then
              manifest=$(find "$d" -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null | sort)
              if [ -n "$manifest" ]; then printf '%s\n' "$manifest" > "$f"; else echo "EXISTS-EMPTY" > "$f"; fi
            else
              echo "ABSENT" > "$f"
            fi
            if ! diff -u "$RUNNER_TEMP/snap_before_$key" "$f" >/dev/null; then
              echo "::error::环境被测试改动：$d"; diff -u "$RUNNER_TEMP/snap_before_$key" "$f" || true; fail=1
            fi
          done
          exit $fail

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    env:
      NODE_AUTH_TOKEN: ${{ secrets.OPENFEEL_AUTO_NPM }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if version changed
        id: version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view openfeel version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$REMOTE_VERSION" ]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
        if: steps.version.outputs.changed == 'true'
      - run: npm run build
        if: steps.version.outputs.changed == 'true'
      - name: Version consistency guard
        if: steps.version.outputs.changed == 'true'
        env:
          OPENFEEL_LOG: '0'
        run: |
          # 版本门禁（stage-48 op-003）：发布前再校验 CLI 与 package.json 版本一致
          # stage-59 M3：注入 OPENFEEL_LOG=0，保持与 build-and-test 一致、避免写真实 HOME
          CLI_VERSION=$(node bin/openfeel.js --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$CLI_VERSION" != "$PKG_VERSION" ]; then echo "::error::版本不一致 CLI=$CLI_VERSION pkg=$PKG_VERSION"; exit 1; fi
      - run: npm publish --access public --registry https://registry.npmjs.org
        if: steps.version.outputs.changed == 'true'
