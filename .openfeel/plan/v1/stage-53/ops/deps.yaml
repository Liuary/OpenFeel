      decision: "多会话并发写 dev_last **加锁保护**：复用 `withFileLock`（`src/core/fs/file-lock.ts:122`）+ `atomicWriteFileSync`；**锁粒度 = 每用户一把**（`dev-last-{username}`，索引与全部主题文件共用，视为同一逻辑事务）；**锁路径 = `projectLockPath(projectPath,'dev-last-{username}')` → `.openfeel/tmp/locks/dev-last-{username}.lock`**（`.openfeel/tmp/` 已被 `.gitignore` 忽略 → 不污染版本库，且不侵入 `users/` 私域）；**临界区一次进出（读也在锁内）**；超时/陈旧沿用默认（5000/3000ms）；**保留「读-合并-写 + 冲突双侧保留」作为锁内的第二道保险**（锁防并发覆盖；合并防跨会话/锁外读取丢失 + 承担冲突取舍语义）；降级（`dist` 不可用）= 至少读-合并-写并标注「未加锁」"
