#   - src/core/i18n-data/{zh-CN,en}.ts 为追加式/改值式键区域，单独不构成互斥；
#   - 但本阶段 op-001/op-002/op-003/op-004 **均改写 src/core/flow-manager.ts**
#     （op-001 CascadeConfig+buildCascadeConfig；op-002 resolveEffectiveConfig；
#      op-003 advanceStagePhase；op-004 registerStage），故四者互相串行。
#   - op-001/op-002 另共享 i18n 两文件；op-004 另改 src/core/plan/scheme.ts（独有）。

# 【外部前置】
external_prerequisites:
  - stage: v1.1.2-stage-41
    status: satisfied   # 实测已执行完毕
    provides:
      - src/core/plan/path.ts 的 validateStageId / findStageDirConflict（op-004 ③ 复用）
      - src/core/flow-manager.ts 的 removeStage / checkRemovable / getPipelinePhases / getPipelineTransitions
    reason: "stage-42 soft 依赖 stage-41（同改 flow-manager.ts/i18n）；op-004 ③ 复用 stage-41 op-002 的 path.ts 导出"

ops:
