    status: satisfied
    reason: "stage-50（T1~T57 清理，已 done）为本阶段热区基线：`flow-manager.ts`/`commands/flow.ts`/`core/plan/scheme.ts`/`i18n-data` 均为其改动区，必须串行其后；且提供两项跨阶段契约（见 upstream_contracts）。"
  - after_stage: v1.1.2-stage-41
    type: soft
    status: satisfied
    reason: "`plan scheme create` / `flow stage remove` / `plan stage add --deps` 为本阶段扩展的基线能力。"

# 【消费的上游契约（stage-50 提供，本阶段必须复用，禁另写实现）】
upstream_contracts:
  - from_stage: v1.1.2-stage-50
    provider_op: op-001
    item: T1
    consumer_op: op-004
    item_local: N4
    type: hard
    contract: "FlowManager.syncCurrentOp(stageName: string): { stage: string; op: string } —— `pipeline.current.op` 生命周期**唯一 owner**；stage-51 的 N4 仅新增 `recordAttempt` 调用点，**不得**自建指针维护逻辑。注意：本阶段 op-004 实施前须先 `rg` 核验该函数存在（不存在则停止并登记 REV）。"
  - from_stage: v1.1.2-stage-50
    provider_op: op-001
    item: T8
    consumer_op: op-007
    item_local: N9
    type: hard
    contract: "kb-dedup.findSimilarEntries(target, category, basePath?) —— basePath = `.openfeel/kb` 绝对路径、**调用时**解析；stage-51 的 `openfeel knowledge dedup` 命令层**只允许传参**（`resolve(projectPath, '.openfeel', 'kb')`），**禁各自实现路径解析**。"

# 【阶段性质提示】
# 反馈二（docs/phase-5/08）修复阶段：N1~N11（3 批次 H1~H3）→ 9 个 op；A1~A8 全部经用户裁定（2026-09-30，不可推翻）。
