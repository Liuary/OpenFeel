# 方案期设计裁定（定稿；供 stage-83/84/85 与审查消费）
scheme_decisions:
  - id: "S-82-1"
    title: "BUG-001 修复口径：非数组 `requirements` 视同空集**重建续建**（非 invalid_field 拒绝）"
    decision: "`data.requirements = Array.isArray(data.requirements) ? data.requirements : [];`（op-001 步骤 1.1）。"
    rationale: "其余 8 原语对非数组容器一律按空集处理（`Array.isArray(...) ? ... : []`）——续建与其口径统一；二者均禁 TypeError 崩溃，续建不新增第二处不对称（add 已为唯一抛错原语）。单点修复（REV-81-019 与 BUG-001 同处，勿双改）。"
  - id: "S-82-2"
    title: "`getAllowedNextStatuses(status): RequirementStatus[]` —— 新增导出（只读纯函数、返回副本）"
    decision: "`return [...(ALLOWED_TRANSITIONS[status] ?? [])];`；`ALLOWED_TRANSITIONS` 保持模块私有（不导出）。"
    rationale: "R-82-6 方案 ①：单一读点（命令层仅 advance/set 两处消费），不采直导出 ALLOWED_TRANSITIONS（第二读点漂移风险）；`?? []` 守卫域外状态（与 applyStatusChange :155-157 同域）；副本防外部直改内部表（对齐 stage-81「查询 API 返回浅副本」纪律）。"
  - id: "S-82-3"
    title: "Q5 定稿：`req next` 筛选 / 排序 / `--owner` 语义 / 输出单条"
    decision: "候选 = `status==='scheduled'` ∧ 未认领（`--owner <name>` 时扩为 ∧（未认领 ∨ owner===name））；排序 ① target_version 升序（未指定恒最后）② created_at 升序 ③ id 升序（稳定兜底）；输出最优 1 条（`--json` → `requirement: {...}|null`）。"
    rationale: "单一「owner 空」筛选会使 `--owner` 形同虚设（签名与语义矛盾）；扩读法与「该认领人视角：可接取 + 自己已认领待推进」一致；未指定 target_version 恒最后（排期明确者优先）；id 兜底保输出确定性（防 created_at 同毫秒抖动）。"
  - id: "S-82-4"
    title: "`board` 空组策略：恒 7 组固定顺序（含空组）"
    decision: "human 逐 7 组打印 `{status}（{n}）`（空组亦打印）；`--json` `groups` 恒 7 键（空组 `[]`，键序 = REQ_STATUSES）。域外脏状态不渲染（容忍登记）。"
    rationale: "固定骨架 = 看板语义 + 输出稳定可断言；顺序派生自 `REQ_STATUSES`（零硬编码）；对齐 kb #两阶段状态 draft/publish 的窄兼容设计「每状态在各自路径显式回答」。"
  - id: "S-82-5"
    title: "`--json` 失败对象形态：`{schemaVersion:1, error:'<code>', ...ctx}`"
    decision: "引擎错误码**逐字**（`not_found` / `stage_not_found` / `already_claimed` / `already_linked` / `invalid_status` / `invalid_field`）+ 命令层码 `no-init` / `invalid-argument`（kebab，对齐 flow archive 既有 JSON 错误名）；context 字段按命令（id / stage / field / value / allowed）。"
    rationale: "引擎码逐字 = 零映射层 + 与 RequirementOpResult 单一来源；命令层码与既有 flow.archive JSON 失败（`no-init` 等 kebab）同形。失败 JSON 走 stdout（对齐 REV-79-003 范式），exit 非 0。"
  - id: "S-82-6"
    title: "`--json` 范围 = `list`/`show`/`board`/`next` 四读命令（写命令无 --json）"
    decision: "与 `stage-82/plan.md` §二 表格冻结一致；写命令的 `--json` 传入走 commander 未知选项报错（显式边界，非遗漏）。"
    rationale: "计划 §二 / T5.1 范围；防方案期越界扩展命令面。后续阶段如需写命令 --json 属纯增量（不改既有键）。"
  - id: "S-82-7"
    title: "`--owner` 缺省链末端口径：`getUserName` 三级链 + 哨兵 `'unknown'` 拒绝"
    decision: "`getUserName(process.cwd())`（identity.ts 单点：`.info.json user` → `git config user.name` → 哨兵 `'unknown'`）；结果为空串**或** `'unknown'` → 拒绝 + 提示显式 `--owner`。"
    rationale: "复用身份单点（零第二实现）；`'unknown'` 为 identity.ts 文档化哨兵（两源皆不可用的唯一出口），视同不可解析——满足 REV-82-012「两者皆无则拒绝」且零硬编码；显式 `--owner`（空串值）直通引擎（零校验 → `invalid_field`）。"
  - id: "S-82-8"
    title: "`link --stage` 归一单点：`normalizeStageId(raw) ?? raw`，无第二解析"
    decision: "仅归一一次；**不做**双键回退、不读 status.md、不做「已注册或有 status.md」宽口径存在性。"
    rationale: "REV-82-006「存在性以引擎为唯一门」+ 计划「仅经 normalizeStageId 归一、禁自写解析」的字面口径；`registerStage` 恒以全名为键，双键回退无实际收益且引入命令层第二读点。"
  - id: "S-82-9"
    title: "`show` 关联阶段 = 仅 stage id 枚举（`data.stages` 键序）"
    decision: "`Object.entries(data.stages).filter(([, s]) => (s.requirement_id ?? null) === id).map(([k]) => k)`；不渲染 phase / 不做 done / 进度计算。"
    rationale: "REV-82-013：聚合摘要归 stage-83；本阶段仅原始只读枚举（`.phase` 入禁止串断言）。"
  - id: "S-82-10"
    title: "advance/set 失败文案的「合法目标」= `getAllowedNextStatuses(current)` 渲染"
    decision: "`req.err.invalidStatusTmpl` {id, to, current, targets}；current 经 `getRequirement` 读 API 渲染（纯呈现）；targets = 引擎导出 join(', ')。"
    rationale: "REV-82-003「命令层零硬编码枚举」；读 API 仅用于文案渲染（非校验）；targets 为引擎全表口径（done 门是否满足由引擎判定，文案层面不改写）。"
  - id: "S-82-11"
    title: "REV-81-018 裁定：登记为接受差异（不统一 add/update 校验风格）"
    decision: "`requirement-ops.ts` 注释登记（op-001 步骤 1.3）；零行为改动。"
    rationale: "构造期 fail-fast 抛错（add）vs 运行期错误码（update）与命令层分流矩阵（REV-82-002）同口径；统一将破坏 stage-81 冻结契约（addRequirement 抛错已为冻结面登记 REV-81-015）。"
  - id: "S-82-12"
    title: "REV-81-020 裁定：命令层规避（严格直传本体），零引擎防御改动"
    decision: "`req add` 直传 `addRequirement` 返回本体至 `writeRequirementBodySkeleton`（禁浅副本）；用例断言 `body_path` 落库。"
    rationale: "默认零防御改动（plan §三 承接表）；浅副本风险由命令层纪律 + 用例固化（body_path 落库断言）；引擎面本阶段仅两处授权补丁。"

