rationale: "plan §三 建议：`op-001 → op-002 → op-003`（同仓串行，降低 review 成本与 i18n 文件冲突）。**本阶段仅 op-002 触及 `i18n-data/*`** → 无 i18n 写面并发问题；`commands/flow.ts` 由 op-001/002 依次编辑 → 已入互斥组。"

