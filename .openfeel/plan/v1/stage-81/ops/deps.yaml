# 方案期设计裁定（定稿；供 stage-82/83/84/85 与审查消费）
scheme_decisions:
  - id: "S-81-1"
    title: "Q4-schema 定稿：`reason` 不入 `RequirementData`（v1.2.0）"
    decision: "`RequirementData` = 10 字段（id/title/status/target_version?/priority?/owner?/claimed_at?/created_at/updated_at/body_path?——REV-81-010 勘正：实数 10，含 `id`）；不含 `reason`（也不含已删的 `source`）。"
    rationale: "① 无本阶段消费方，与 REV-81-005 删 `source?` 同判据；② blocked 事由承载面已足——人读走 REQ 正文（变更记录节）、机读走 `log[]` 审计 detail（stage-82 `req set --status blocked` 如需携事由入 detail，无需 schema 变更）；③ 未来增补 `reason?: string` 为纯增量可选字段（读侧宽容 + 缺省回落已是本版纪律），零迁移；④ 与裁定 N 边界与「减法优先」一致。"
  - id: "S-81-2"
    title: "requirements 读侧宽容（承 REV-81-003 裁定 (a)）"
    decision: "不 load 补齐；读侧 `getRequirements(data) ?? []` 派生；写侧 `addRequirement` 内 `??= []` 后 push；「纯 load→save 不注入」硬断言。"
  - id: "S-81-3"
    title: "状态流转单点表 + done 门（裁定 3/4）"
    decision: "draft→scheduled；scheduled→in_progress；in_progress→done（门 = allLinkedStagesDone，零关联拒绝）；任意非终态→blocked/cancelled/rejected；blocked→scheduled/in_progress；同值幂等；终态不再显式流转。advance = update({status}) 委托。"
  - id: "S-81-4"
    title: "releaseRequirement 无占用者 = no-op 成功（Q3 定稿）"
    decision: "{ok:true, changed:false}；不刷 updated_at、不写审计、不设状态门。"
  - id: "S-81-5"
    title: "正文骨架定稿（裁定 K/6/7）"
    decision: "七章节（标题/状态/摘要/目标与验收/预估版本/关联阶段/变更记录）+ 创建时快照 + 「机读权威恒为 flow.json」注记；已存在 → no-op 不覆盖（无 overwrite 参数）；body_path 恒 POSIX 相对路径、由 writeRequirementBodySkeleton 单点赋值。"
  - id: "S-81-6"
    title: "`.openfeel/requirements/` 不入 WORKSPACE_DIRS（按需 mkdir 幂等创建）"
    decision: "与 `.openfeel/flow-archive/`（stage-78 Q2 定稿）同口径；目录惰性创建，工作区结构声明零改动。"
  - id: "S-81-7"
    title: "错误码 6 项与审计 action 表冻结（裁定 9）"
    decision: "not_found / stage_not_found / already_claimed / already_linked / invalid_status / invalid_field；审计 requirement_add / requirement_claim / requirement_release / requirement_status / requirement_update / requirement_link（仅实际变更写）。"

# 下游契约（交付 stage-82/83；接口形态 = 函数签名级；禁第二套实现）
downstream_contracts:
  - name: "src/core/req/ :: 需求原语（stage-81 交付，stage-82/83 消费）"
    change: "冻结签名：getRequirements(data: FlowData): RequirementData[]（读侧宽容 ?? [] + 浅副本）；getRequirement(data, id: string): RequirementData | null（浅副本）；listRequirements(data, filter?: { status?: RequirementStatus; target_version?: string; owner?: string }): RequirementData[]（多条件 AND）；nextRequirementId(data): string（max+1 不回收，异常 id 跳过）；addRequirement(data, input: { title: string; target_version?: string; priority?: RequirementPriority }): RequirementData（**新建即 status:'draft'；无 source；返回本体；非法入参 throw**）；claimRequirement(data, id, owner): RequirementOpResult（owner 空串 invalid_field；终态 invalid_status；他人占用 already_claimed **不写盘**）；releaseRequirement(data, id): RequirementOpResult（无占用 no-op 成功）；updateRequirement(data, id, patch: { status?: RequirementStatus; title?: string; target_version?: string; priority?: RequirementPriority }): RequirementOpResult（白名单外键 invalid_field；整 patch 先校验后落地）；advanceRequirement(data, id, to: RequirementStatus): RequirementOpResult（= update({status}) 委托）；linkRequirement(data, stageId, requirementId: string | null): RequirementOpResult（null = 解绑）；allLinkedStagesDone(data, requirementId): boolean（done 门单一口径；零关联 false）；isTerminalRequirementStatus(status): boolean。**全部纯内存；save 由调用方承担。** **命名统一（REV-81-012）**：`target_version` 为唯一命名——存储字段 / add input / list filter / update patch 四处同名（零映射层）。**`updated_at` 单次赋值（REV-81-013）**：状态维度由 `applyStatusChange` 刷新、字段维度由 update 收尾刷新；两维度并存不重复赋值。**抛错不对称登记（REV-81-015）**：`addRequirement` 非法入参 throw（构造期入参校验 / 编程错误）为唯一不对称；其余写原语恒错误码（业务冲突）；命令层捕获 throw 后同走 exit 非 0 零写盘。"
  - name: "src/core/req/ :: 结果/错误码类型（stage-81 交付）"
    change: "RequirementOpResult = { ok: true; changed: boolean } | { ok: false; code: RequirementErrorCode }；RequirementErrorCode = 'not_found' | 'stage_not_found' | 'already_claimed' | 'already_linked' | 'invalid_status' | 'invalid_field'。命令层映射：错误码 → exit 非 0 零写盘（并发冲突 exit 2 沿用 save() 既有语义）。"
  - name: "src/core/req/types.ts :: 类型与常量（stage-81 交付）"
    change: "REQ_STATUSES（7 值 as const）/ RequirementStatus（自常量派生）/ REQ_PRIORITIES（P0/P1/P2）/ RequirementPriority / REQ_ID_PATTERN（正则恒含数字捕获组；非全局标志）/ RequirementData（10 字段——REV-81-010 勘正）。命令层值域校验**从此派生，禁硬编码**（核验 B13/B20）。"
  - name: "src/core/req/body-file.ts :: 正文文件原语（stage-81 交付，stage-82 消费）"
    change: "getRequirementsDir(projectPath): string；getRequirementBodyRelPath(id): string（恒 POSIX）；getRequirementBodyPath(projectPath, id): string；writeRequirementBodySkeleton(projectPath, req: RequirementData): string（mkdir 幂等 + 已存在 no-op 不覆盖 + **req.body_path 单点赋值** + atomicWriteFileSync；返回绝对路径）。**目录不入 WORKSPACE_DIRS**（按需创建）。"
  - name: "src/core/flow-manager.ts :: FlowData / StageData 字段契约（stage-81 定稿）"
    change: "FlowData.requirements?: RequirementData[]（**读侧宽容**：getRequirements 派生 ?? []；**不** load 补齐——REV-81-003）；StageData.requirement_id?: string | null（缺省 ≡ null，存量不迁移——裁定 D/L）。**新增字段一律可选 + 读侧宽容（缺省回落）**；load/save 零语义改动。"
  - name: "审计 action 契约（stage-81 交付；stage-82/83 追加同类）"
    change: "requirement_add / requirement_claim / requirement_release / requirement_status（detail { id, from, to }）/ requirement_update（detail { id, fields }）/ requirement_link（detail { stage, requirementId }）——**仅实际变更后写**；stage-83 自动回写用 requirement_auto_done（大计划 B7）。"
  - name: "Q4-schema 定稿（承大计划 §十 Q4；stage-82/85 消费）"
    change: "reason 不入 RequirementData（v1.2.0）。blocked 事由：人读 → REQ 正文变更记录节；机读 → 审计 detail（如 stage-82 需要）。未来增补为纯增量可选字段（读侧宽容纪律已备）。"

