# 方案期设计裁定（定稿；供 stage-84/85 与审查消费）
scheme_decisions:
  - id: "S-83-1"
    title: "`computeRequirementAggregate` 首参形态定稿 = 直委托方案（`(data: FlowData, requirementId)`）"
    decision: "首参取 `data: FlowData`，done 分支**直接调用** `allLinkedStagesDone(data, requirementId)`；**不**抽 stages 级核心谓词、**不**改造 `allLinkedStagesDone`（零改动 `requirement-ops.ts`）——REV-83-011 契约同步落实。"
    rationale: "REV-83-011 两案择①：委托点唯一（单行调用）且 `requirement-ops.ts` 零触碰——避开 REV-81-016/019 防双改区（改造薄壳会触碰该文件）；`stageCount>0` 门 + 委托即空集守卫同源。契约由 `(stages, requirementId)` 平移为 `(data, requirementId)`（`deps.yaml` 下游契约同步登记）。"
  - id: "S-83-2"
    title: "`syncRequirementStatus` 落点 = `src/core/req/aggregate.ts`（req 层自由函数）"
    decision: "回写入口为 req 层纯函数（`(data, stageId) => string[]`）；`flow-manager.ts` 仅 1 行 import + 2 处调用（无第二实现）。"
    rationale: "契约签名首参为 `data`（非方法）；需求写语义内聚 req 层（与 `requirement-ops.ts` 的「纯内存 + 审计内嵌 `data.log`」同范式）；`aggregate.ts` 对 flow-manager 仅 `import type` → 零运行时环（`requirement-ops` 对 flow-manager 亦为 type-only）。"
  - id: "S-83-3"
    title: "回写入口为**声明式单入口、不绑定事件**：advance 路径漂移态亦自愈回退"
    decision: "`syncRequirementStatus` 内两条规则按**状态**判定（聚合 done ∧ 前置集内 → done；聚合 ≠ done ∧ status===done → in_progress）；`done × 聚合非done` 格在 advance 路径（漂移态）亦触发回退 + 审计。**显式登记**：T4.2 矩阵「done × 聚合非done」格断言 = 「回退 + 审计」（非零动作）。"
    rationale: "plan §二 不变量 8 明写「回退条件 = 重算聚合 ≠ done ∧ status === done（**不绑定事件**）」+ REV-83-005 聚合视图表述；该格仅漂移态可达（正常序列中 reset 已在阶段离开 done 时即时回退），回退即**投影自愈**（kb #状态/相位单一事实源「投影可重算 = 漂移自愈」）。T4.2 矩阵「仅 `{scheduled,in_progress}` × 聚合 done 回写；其余零动作零审计」按 **auto-done 规则**读（矩阵名即「auto-done 前置集矩阵」）；非 done 列在 advance 路径对 6 个非 done 状态零动作零审计逐格断言。"
  - id: "S-83-4"
    title: "前置集单点常量 `AUTO_DONE_PRECONDITION = ['scheduled','in_progress']`（回写与 health 同口径）"
    decision: "常量导出（`readonly RequirementStatus[]`）；`syncRequirementStatus` 守卫与 `requirementHealthItems` 漂移判据**共用同一常量**（禁第二份列表）。"
    rationale: "plan §二 health 行「与回写前置集同口径」的结构化保证——单一来源使二者不可能漂移；REV-83-004 用户裁定（维持 `{scheduled, in_progress}`——REV-83-009 已同步大计划裁定 H/M）。"
  - id: "S-83-5"
    title: "回退目标恒 `in_progress`（维持计划默认；不做 `done→scheduled` 细粒度回退）"
    decision: "重算聚合 ∈ {`scheduled`, `in_progress`} 且 status=done → 一律回退 `in_progress`。"
    rationale: "plan §二 明示「不做 `done→scheduled` 细粒度回退；方案期可再裁」——方案期维持默认（回退目标单点、断言确定性最强；语义上需求已投放过执行，regress 为「待续推进」而非「未开工」）。"
  - id: "S-83-6"
    title: "审计形态：`requirement_auto_done` / `requirement_auto_reopen`，`agent: 'cli'`，detail `{requirementId, from, to, triggerStage}`"
    decision: "经私有 `appendAggregateLog`（`data.log.push({time, agent:'cli', action, detail})`——与 `requirement-*` 家族同形）；**状态实际变化才写**；`updated_at` 刷新（状态维度单次赋值纪律）。"
    rationale: "动作名 `requirement_*` 家族 → agent 值随族（`'cli'`）保持单一；detail 携 `triggerStage` 供溯源（哪个阶段推进触发的回写）；审计单点语义对齐 `flow-manager.appendLog`（:2688）载荷形态。"
  - id: "S-83-7"
    title: "health 需求对账落点 = `requirementHealthItems`（aggregate.ts）+ `flow.ts` 合并；两 item（`需求对账` 恒产生 + `需求漂移` 条件）"
    decision: "① `需求对账`（悬空关联）：恒产生 1 条 pass/warn（对齐归档对账 a 项范式）；② `需求漂移`（前置集内 ∧ 聚合 done ∧ status ≠ done）：仅非空时 warn（对齐 b 项范式）；section 为中文常量（对齐 archive 先例）；消息 3 键入 i18n 双表 `flow.health.req*`。"
    rationale: "Q6 定稿（REV-83-006）：warn 级 / 不改退出码 / 不参与 `--fix`；两类问题分离（悬空 = 数据完整性、漂移 = 状态一致性）便于 `--json` 按 name 断言；漂移判据与回写守卫同口径（S-83-4）——「本应被回写而未回写」的可见化。`draft/blocked/终态` 为设计豁免不报。"
  - id: "S-83-8"
    title: "零回归取证口径：补丁前/后快照 diff（路径 ①③）+ 单测三断言 + 正控（对照实验）"
    decision: "「逐字节一致」= 归一化（置零 `meta.revision` / `meta.updated` / `log[*].time` / `stats` 时间三字段，S-83-8 口径）后 JSON 逐字相等；取证 = ① op-002 步骤 2.1 补丁前捕获 + 2.5 补丁后复跑 diff 为空（真基线）；② 单测以内联 golden 常驻断言（含 ③ deprecated 路径同 golden）；③ 三路径（advanceStagePhase / wizard / deprecated advancePhase）统一四断言：零注入 + `requirement_` 零审计 + golden/字段期望 + **正控**（加关联即出现 auto_done，防「零命中」恒真假绿）。"
    rationale: "计划 T4.3「逐字节一致（fixture 快照对比）」+ REV-83-007 三路径口径；时间类字段为 save/start/end 必然改写项（kb #flow.json 内容增量核验必含 meta.revision/meta.updated 的口径扩展）；wizard 为命令层（pre/post 脚本化成本高）→ 以三断言 + 正控覆盖（口径同）。"
