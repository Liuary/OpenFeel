# 【互斥（禁止并行）】
mutual_exclusions:
  - group: [op-001, op-002]
    reason: "**同文件互斥**：二者均改 `src/core/templates-data/agents-md/{zh-CN,en}.md`（op-001 改工作区结构节 + 开发目录 current 段；op-002 改私域 dev_last 段）→ 必须**顺序编辑**（op-001 → op-002），否则行号漂移/内容互相覆盖。"
  - group: [op-001, op-002, op-003]
    reason: "**`templates-data/**` 权威源共享**：三者的改动最终同经一次 `npm run build` 传播（`template-loader.ts` 生成段 + `update.ts` 注入 + `.opencode/**` 自举）→ 禁止并发编辑权威源。"
  - group: [op-001, op-002, op-003, op-004, op-005]
    reason: "**构建/测试互斥 + 顺序收口**：op-005 的 `npm run build` 必须在 op-001~003 的权威源改动**全部落定后**执行（避免重复重生成）；op-004 为数据迁移（不涉 build，但须在格式定稿后执行）。"
  - group: [op-004, op-005]
    reason: "**数据依赖**：op-005 的 `templates.test.ts` 断言（current 模板不含 `团队成员进度`）与 op-004 的迁移成果需一致；且 op-004 若因格式回退而重做，op-005 的断言须同步。"

