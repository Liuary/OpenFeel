# 下游契约（交付 stage-83/84/85；接口形态 = 命令面 + 函数签名级）
downstream_contracts:
  - name: "`openfeel req` 命令面（10 子命令；本阶段交付）"
    change: "add / list / show / claim / release / set / link / advance / board / next；全组统一 `--target-version`（零 `--version`）；`--json` 范围 = 四读命令（list/show/board/next）；退出码 0/1/2（并发）；`link` 命令形态 `req link --stage <stageId> (--requirement <REQ-NNN> | --unlink)`；`advance` = `req advance <REQ-NNN> --to <status>`（不设 --force）。"
  - name: "`--json` 载荷形态（本阶段交付）"
    change: "list → `{schemaVersion:1, requirements: RequirementData[]}`；show → `{schemaVersion:1, requirement, stages: string[]}`（仅 id 枚举）；board → `{schemaVersion:1, groups: Record<RequirementStatus, RequirementData[]>}`（恒 7 键）；next → `{schemaVersion:1, requirement: RequirementData | null}`；失败统一 `{schemaVersion:1, error:'<code>', ...ctx}` + exit 非 0。"
  - name: "`src/core/req/requirement-ops.ts :: getAllowedNextStatuses`（本阶段新增导出）"
    change: "`getAllowedNextStatuses(status: RequirementStatus): RequirementStatus[]`——只读纯函数；域外状态 → `[]`；返回副本；`ALLOWED_TRANSITIONS` 保持模块私有。命令面唯一消费点（advance/set 文案渲染）；stage-83 如复用须经此单点。"
  - name: "i18n 键前缀（本阶段交付）"
    change: "`req.*`（42 键）+ `help.req.*`（37 键）；新基线 **908**（829 + 79；lint i18n 实测为准）；键清单冻结于各 op「i18n 键清单」节。"

