  - op-004
  - op-001
  - op-002
rationale: "op-005（REV-011 blocking）优先修复以解除阻塞（仅测试文件、无冲突）；其后按计划 §七 op-003 → op-004 → op-001 → op-002 串行（op-001→op-002 强关联）。"
